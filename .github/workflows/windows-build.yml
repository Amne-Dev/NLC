name: Build Windows Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Read App Version
        shell: pwsh
        run: |
          $version = python -c "from config import CURRENT_VERSION; print(CURRENT_VERSION)"
          if (-not $version) { throw "Could not read CURRENT_VERSION from config.py" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Agent
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean agent.spec

      - name: Build Patch Runner
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean patch_runner.spec

      - name: Build Launcher
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean alt.spec

      - name: Build Installer
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean installer_app.spec

      - name: Prepare Artifact Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Copy-Item -Force dist\NLCSetup.exe installer\NLCSetup.exe
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -Force dist\agent.exe release-assets\agent.exe
          Copy-Item -Force dist\NLCUpdater.exe release-assets\NLCUpdater.exe
          Copy-Item -Force dist\NewLauncher.exe release-assets\NewLauncher.exe
          Copy-Item -Force dist\NLCSetup.exe release-assets\NLCSetup.exe
          Copy-Item -Force logo.ico release-assets\logo.ico
          Copy-Item -Force logo.png release-assets\logo.png

      - name: Generate Checksums
        shell: pwsh
        run: |
          $files = @(
            "release-assets\agent.exe",
            "release-assets\NLCUpdater.exe",
            "release-assets\NewLauncher.exe",
            "release-assets\NLCSetup.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Path release-assets\SHA256SUMS.txt

      - name: Build Incremental Patch
        shell: pwsh
        run: |
          python -c @'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path

          root = Path("release-assets")
          version = os.environ["APP_VERSION"]
          current_tag = "v" + version
          tags = subprocess.check_output(
              ["git", "tag", "--sort=-version:refname"], text=True
          ).splitlines()
          previous_tag = next((tag for tag in tags if tag != current_tag), "")
          previous_version = previous_tag.removeprefix("v") or "unknown"
          changed = set()
          if previous_tag:
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", previous_tag, current_tag],
                  text=True,
              ).splitlines())

          launcher_changed = any(
              path.startswith("nlc/")
              or path in {"alt.py", "main.py", "config.py", "requirements.txt"}
              for path in changed
          )
          agent_changed = any(
              path == "agent.py" or path.startswith("nlc/agent/")
              for path in changed
          )
          assets_changed = any(path in {"logo.ico", "logo.png"} for path in changed)
          names = ["NLCUpdater.exe"]
          if launcher_changed or not previous_tag:
              names.append("NewLauncher.exe")
          if agent_changed or not previous_tag:
              names.append("agent.exe")
          for name in ("logo.ico", "logo.png"):
              if (root / name).exists() and (assets_changed or not previous_tag):
                  names.append(name)

          runner_data = (root / "NLCUpdater.exe").read_bytes()
          manifest = {
              "formatVersion": 1,
              "platform": "windows",
              "baseVersion": previous_version,
              "targetVersion": version,
              "runner": "NLCUpdater.exe",
              "runnerSha256": hashlib.sha256(runner_data).hexdigest(),
              "files": [],
          }
          patch_name = f"NLCUpdate-{previous_version}-to-{version}.zip"
          with zipfile.ZipFile(root / patch_name, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  data = (root / name).read_bytes()
                  archive.writestr("files/" + name, data)
                  manifest["files"].append({
                      "path": name,
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })
              archive.writestr("manifest.json", json.dumps(manifest, indent=2))
          (root / "NLCUpdate.zip").write_bytes((root / patch_name).read_bytes())
          '@

      - name: Generate WinGet Manifest Candidate
        shell: pwsh
        run: |
          $manifestRoot = "release-assets\winget\amne-dev\nlc\$env:APP_VERSION"
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          $installerHash = (Get-FileHash -Algorithm SHA256 "release-assets\NLCSetup.exe").Hash.ToLower()
          $installerUrl = "https://github.com/Amne-Dev/New-launcher/releases/download/v$env:APP_VERSION/NLCSetup.exe"
          @"
          PackageIdentifier: amne-dev.nlc
          PackageVersion: $env:APP_VERSION
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.12.0
          "@ | Set-Content -Path "$manifestRoot\amne-dev.nlc.yaml"
          @"
          PackageIdentifier: amne-dev.nlc
          PackageVersion: $env:APP_VERSION
          InstallerType: exe
          Installers:
          - Architecture: x64
            InstallerUrl: $installerUrl
            InstallerSha256: $installerHash
            InstallerSwitches:
              Silent: --quiet
              SilentWithProgress: --quiet
          ManifestType: installer
          ManifestVersion: 1.12.0
          "@ | Set-Content -Path "$manifestRoot\amne-dev.nlc.installer.yaml"
          @"
          PackageIdentifier: amne-dev.nlc
          PackageVersion: $env:APP_VERSION
          PackageLocale: en-US
          Publisher: Amne-Dev
          PublisherUrl: https://github.com/Amne-Dev
          PackageName: NLC
          PackageUrl: https://web.get-nlc.tech/
          License: BSD 3-Clause License
          LicenseUrl: https://raw.githubusercontent.com/Amne-Dev/New-launcher/main/LICENSE
          ShortDescription: A Minecraft launcher for managing accounts, installations, mods, and skins.
          Description: New Launcher is a desktop Minecraft launcher for Windows.
          Moniker: nlc
          Tags:
          - minecraft
          - launcher
          - modpacks
          - mods
          - skins
          ReleaseNotesUrl: https://github.com/Amne-Dev/New-launcher/releases/
          ManifestType: defaultLocale
          ManifestVersion: 1.12.0
          "@ | Set-Content -Path "$manifestRoot\amne-dev.nlc.locale.en-US.yaml"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-v${{ env.APP_VERSION }}
          path: release-assets/*
          if-no-files-found: error

      - name: Attach Assets To Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/NLCSetup.exe
            release-assets/NLCUpdate.zip
            release-assets/NLCUpdate-*.zip
            release-assets/SHA256SUMS.txt