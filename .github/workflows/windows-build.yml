name: Build Windows Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      NLC_UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.NLC_UPDATE_SIGNING_PRIVATE_KEY_B64 }}
      NLC_UPDATE_PUBLIC_KEY_B64: ${{ secrets.NLC_UPDATE_PUBLIC_KEY_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Read App Version
        shell: pwsh
        run: |
          $version = (Get-Content -Path VERSION -Raw).Trim()
          if (-not $version) { throw "Could not read version from VERSION" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Update Verification Key
        shell: pwsh
        run: |
          if (-not $env:NLC_UPDATE_PUBLIC_KEY_B64) {
            throw "NLC_UPDATE_PUBLIC_KEY_B64 repository secret is required."
          }
          python -c @'
          import os
          from pathlib import Path
          key = os.environ["NLC_UPDATE_PUBLIC_KEY_B64"]
          Path("src/backend/nlc/update_keys.py").write_text(
              "PATCH_PUBLIC_KEY_B64 = " + repr(key) + "\n",
              encoding="utf-8",
          )
          '@

      - name: Build Patch Runner
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean packaging/windows/patch_runner.spec

      - name: Build Launchers and Installers
        shell: pwsh
        run: python packaging/windows/build_installers.py --all --version $env:APP_VERSION

      - name: Prepare Artifact Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -Force dist\installers\NLCSetup.exe installer\NLCSetup.exe
          Copy-Item -Force dist\agent.exe release-assets\agent.exe
          Copy-Item -Force dist\NLCUpdater.exe release-assets\NLCUpdater.exe
          Copy-Item -Force dist\NyLuna.exe release-assets\NyLuna.exe
          Copy-Item -Force dist\installers\NLCSetup.exe release-assets\NLCSetup.exe
          Copy-Item -Force dist\installers\NLCSetup-Offline.exe release-assets\NLCSetup-Offline.exe
          if (Test-Path dist\libunwind.dll) {
            Copy-Item -Force dist\libunwind.dll release-assets\libunwind.dll
          }
          if (Test-Path dist\release_manifest.json) {
            Copy-Item -Force dist\release_manifest.json release-assets\release_manifest.json
          }
          if (Test-Path dist\assets.zip) {
            Copy-Item -Force dist\assets.zip release-assets\assets.zip
          }
          if (Test-Path dist\*.cdc.json) {
            Copy-Item -Force dist\*.cdc.json release-assets\
          }
          Copy-Item -Force logo.ico release-assets\logo.ico
          Copy-Item -Force logo.png release-assets\logo.png

      - name: Generate Checksums
        shell: pwsh
        run: |
          $files = @(
            "release-assets\agent.exe",
            "release-assets\NLCUpdater.exe",
            "release-assets\NyLuna.exe",
            "release-assets\NLCSetup.exe",
            "release-assets\NLCSetup-Offline.exe"
          )
          if (Test-Path release-assets\libunwind.dll) {
            $files += "release-assets\libunwind.dll"
          }
          if (Test-Path release-assets\assets.zip) {
            $files += "release-assets\assets.zip"
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Path release-assets\SHA256SUMS.txt

      - name: Build Incremental Patch
        shell: pwsh
        run: |
          python -c @'
          import base64, hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          root = Path("release-assets")
          version = os.environ["APP_VERSION"]
          current_tag = "v" + version
          tags = subprocess.check_output(
              ["git", "tag", "--sort=-version:refname"], text=True
          ).splitlines()
          previous_tag = next((tag for tag in tags if tag != current_tag), "")
          if not previous_tag:
              raise SystemExit("A previous version tag is required to build a differential patch.")
          previous_version = previous_tag.removeprefix("v")
          target_ref = current_tag if current_tag in tags else "HEAD"
          changed = set()
          if previous_tag:
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", previous_tag, target_ref],
                  text=True,
              ).splitlines())

          launcher_changed = any(
              path.startswith("src/")
              or path.startswith("nlc/")
              or path in {"alt.py", "main.py", "config.py", "requirements.txt"}
              for path in changed
          )
          agent_changed = any(
              path == "agent.py" or path.startswith("src/backend/")
              for path in changed
          )
          assets_changed = any(path in {"logo.ico", "logo.png"} for path in changed)
          names = ["NLCUpdater.exe"]
          if launcher_changed:
              names.append("NyLuna.exe")
          if agent_changed:
              names.append("agent.exe")
          if (root / "libunwind.dll").exists():
              names.append("libunwind.dll")
          for name in ("logo.ico", "logo.png"):
              if (root / name).exists() and assets_changed:
                  names.append(name)

          runner_data = (root / "NLCUpdater.exe").read_bytes()
          manifest = {
              "formatVersion": 1,
              "platform": "windows",
              "baseVersion": previous_version,
              "targetVersion": version,
              "runner": "NLCUpdater.exe",
              "runnerSha256": hashlib.sha256(runner_data).hexdigest(),
              "files": [],
          }
          patch_name = f"NLCUpdate-{previous_version}-to-{version}.zip"
          with zipfile.ZipFile(root / patch_name, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  data = (root / name).read_bytes()
                  archive.writestr("files/" + name, data)
                  manifest["files"].append({
                      "path": name,
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })
              private_key_text = os.environ.get("NLC_UPDATE_SIGNING_PRIVATE_KEY_B64", "")
              if not private_key_text:
                  raise SystemExit("NLC_UPDATE_SIGNING_PRIVATE_KEY_B64 secret is required.")
              private_key = Ed25519PrivateKey.from_private_bytes(
                  base64.b64decode(private_key_text, validate=True)
              )
              unsigned_manifest = json.dumps(
                  manifest,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
              ).encode("utf-8")
              manifest["signature"] = base64.b64encode(
                  private_key.sign(unsigned_manifest)
              ).decode("ascii")
              archive.writestr("manifest.json", json.dumps(manifest, indent=2))
          '@

      - name: Build CDC Index & Release Manifest
        shell: pwsh
        run: |
          python scripts/generate_release_cdc.py --dir release-assets --version $env:APP_VERSION

      - name: Generate WinGet Manifest Candidate
        shell: pwsh
        run: |
          $manifestRoot = "release-assets\winget\amne-dev\nlc\$env:APP_VERSION"
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          $installerHash = (Get-FileHash -Algorithm SHA256 "release-assets\NLCSetup.exe").Hash.ToLower()
          $installerUrl = "https://github.com/Amne-Dev/NLC/releases/download/v$env:APP_VERSION/NLCSetup.exe"
          @"
          PackageIdentifier: amne-dev.nlc
          PackageVersion: $env:APP_VERSION
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.12.0
          "@ | Set-Content -Path "$manifestRoot\amne-dev.nlc.yaml"
          @"
          PackageIdentifier: amne-dev.nlc
          PackageVersion: $env:APP_VERSION
          InstallerType: exe
          Installers:
          - Architecture: x64
            InstallerUrl: $installerUrl
            InstallerSha256: $installerHash
            InstallerSwitches:
              Silent: --quiet
              SilentWithProgress: --quiet
          ManifestType: installer
          ManifestVersion: 1.12.0
          "@ | Set-Content -Path "$manifestRoot\amne-dev.nlc.installer.yaml"
          @"
          PackageIdentifier: amne-dev.nlc
          PackageVersion: $env:APP_VERSION
          PackageLocale: en-US
          Publisher: Amne-Dev
          PublisherUrl: https://github.com/Amne-Dev
          PackageName: NLC
          PackageUrl: https://web.get-nlc.tech/
          License: BSD 3-Clause License
          LicenseUrl: https://raw.githubusercontent.com/Amne-Dev/NLC/main/LICENSE
          ShortDescription: A Minecraft launcher for managing accounts, installations, mods, and skins.
          Description: New Launcher is a desktop Minecraft launcher for Windows.
          Moniker: nlc
          Tags:
          - minecraft
          - launcher
          - modpacks
          - mods
          - skins
          ReleaseNotesUrl: https://github.com/Amne-Dev/NLC/releases/
          ManifestType: defaultLocale
          ManifestVersion: 1.12.0
          "@ | Set-Content -Path "$manifestRoot\amne-dev.nlc.locale.en-US.yaml"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-v${{ env.APP_VERSION }}
          path: release-assets/*
          if-no-files-found: error

      - name: Attach Assets To Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            release-assets/NLCSetup.exe
            release-assets/NLCSetup-Offline.exe
            release-assets/NyLuna.exe
            release-assets/agent.exe
            release-assets/libunwind.dll
            release-assets/NLCUpdater.exe
            release-assets/release_manifest.json
            release-assets/assets.zip
            release-assets/NyLuna.exe.cdc.json
            release-assets/agent.exe.cdc.json
            release-assets/libunwind.dll.cdc.json
            release-assets/*.cdc.json
            release-assets/NLCUpdate-*.zip
            release-assets/SHA256SUMS.txt