[package]
name = "nlc-ui"
version = "4.0.2"
edition = "2021"
description = "High-performance GPU-rendered desktop user interface for Ny-Luna Core"
authors = ["@amne-dev"]
license = "BSD-3-Clause"

[dependencies]
slint = "1.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "process", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
image = "0.25"
base64 = "0.23"
rfd = "0.17"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = false

[profile.dev]
debug = 1
